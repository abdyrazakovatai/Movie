<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel & Movies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            background-image: url('https://www.example.com/your-background-image.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Accordion Styles */
        .accordion {
            background-color: #333;
            color: #fff;
            padding: 10px;
            width: 50%; /* Укоротили ширину кнопок */
            max-width: 300px;
            margin: 10px auto; /* Центровка */
            border: none;
            text-align: center;
            outline: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s ease;
        }

        .accordion:hover {
            background-color: #6a4c9c;
        }

        .active, .accordion:active {
            background-color: #6a4c9c;
        }

        .panel {
            padding: 0 18px;
            background-color: #222;
            max-height: 0;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out;
        }

        .panel.open {
            max-height: 500px; /* Ограничение высоты при открытии */
            padding: 20px 18px;
        }

        /* Form Styles */
        .form-container label, .form-container input, .form-container select, .form-container button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
        }

        .form-container button {
            background: linear-gradient(45deg, #6a4c9c, #4b347d);
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .form-container button:hover {
            background: linear-gradient(45deg, #4b347d, #6a4c9c);
        }
    </style>
</head>
<body>

<!-- Accordion Buttons -->
<button class="accordion" onclick="togglePanel('addMoviePanel')">Add Movie</button>
<div id="addMoviePanel" class="panel">
    <h2>Add New Movie</h2>

    <a href="/movies/add">Add Movie</a>

</div>

<button class="accordion" onclick="togglePanel('addHallPanel')">Add Hall</button>
<div id="addHallPanel" class="panel">
    <h2>Add New Hall</h2>
    <form action="/movies/saveHall" method="POST" class="form-container">
        <label for="cinemaId">Select Cinema:</label>
        <select id="cinemaId" name="cinemaId" required>
            <option value="" disabled>Select a cinema</option>
            <option th:each="cinema : ${cinemas}" th:value="${cinema.id }" th:text="${cinema.name}"></option>
        </select><br><br>
        <label for="name">Hall Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="seatCount">Seat Count:</label>
        <input type="number" id="seatCount" name="seatCount" required>


        <button type="submit">Add Hall</button>
    </form>
</div>

<button class="accordion" onclick="togglePanel('addShowtimePanel')">Add Showtime</button>
<div id="addShowtimePanel" class="panel">
    <h2>Add Showtime</h2>
    <form action="/movies/saveShowTime" method="POST" class="form-container">
<!--        <label for="movieId">Select Movie:</label>-->
<!--        <select id="movieId" name="movieId" required></select>-->
        <label for="movies">Select Movie:</label>
        <select id="movies" name="movieId" required>
            <th:block th:each="movie : ${movies}">
                <option th:value="${movie.id}" th:text="${movie.movieName}"></option>
            </th:block>
        </select>
<!--        <label for="hallId">Select Hall:</label>-->
<!--        <select id="hallId" name="hallId" required></select>-->
        <!-- Hall -->

        <label for="hallId">Select Hall:</label>
        <select id="hallId" name="hallId" required>
            <option value="" disabled>Select a cinema</option>
            <option th:each="hall : ${halls}" th:value="${hall.id }" th:text="${hall.name}"></option>
        </select><br><br>


        <label for="startTime">Start Time:</label>
        <input type="datetime-local" id="startTime" name="startTime" required>

        <label for="price">Price:</label>
        <input type="number" step="0.01" id="price" name="price" required>
        <button type="submit">Save Showtime</button>

        <!-- Start Time -->
<!--        <label for="startTime">Start Time</label>-->
<!--        <input type="datetime-local" id="startTime" name="startTime" required>-->

<!--        &lt;!&ndash; Price &ndash;&gt;-->
<!--        <label for="price">Price</label>-->
<!--        <input type="number" step="0.01" id="price" name="price" placeholder="Enter Price" required>-->

    </form>
</div>

<script>
    function togglePanel(panelId) {
        const panel = document.getElementById(panelId);
        panel.classList.toggle("open");
    }
</script>

</body>
</html>
