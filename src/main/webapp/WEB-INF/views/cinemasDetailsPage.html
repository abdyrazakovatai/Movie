<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Catalog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<style>

    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
    }

    .cinema-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: space-around;
    }

    .hall-card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 300px;
        padding: 20px;
        text-align: center;
    }

    .hall-name {
        font-size: 1.8rem;
        margin-bottom: 15px;
        color: #0078d7;
        text-transform: uppercase;
        padding-bottom: 5px;
        border-bottom: 2px solid #ddd;
    }

    .showtime-card {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        background-color: #f9f9f9;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .showtime-card:hover {
        transform: translateY(-5px);
        background-color: #eef7ff;
    }

    .showtime-link {
        text-decoration: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        color: inherit;
    }

    .movie-name {
        font-size: 1.2rem;
        color: #34495e;
    }

    .showtime-time {
        background-color: #2ecc71;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 1rem;
    }

    .showtime-card a {
        text-decoration: none;
        color: #34495e;
    }

    @media (max-width: 768px) {
        .cinema-container {
            flex-direction: column;
            align-items: center;
        }

        .hall-card {
            width: 90%;
        }
    }



</style>

<header>
    <h1>Movie Catalog</h1>
</header>



<div class="cinema-container">
    <div th:each="hall : ${cinema.halls}" class="hall-card">
        <!-- Название зала -->
        <h3 th:text="${hall.name}" class="hall-name">Зал 1</h3>

        <!-- Сеансы внутри зала -->
        <div th:each="showtime : ${showtimes}" class="showtime-card">
            <a th:href="@{/movies/showtime(id=${showtime.id})}" class="showtime-link">
                <span class="movie-name" th:text="${showtime.movie.movieName}">Movie Name</span>
                <span class="showtime-time" th:text="${showtime.startTime}">Start Time</span>
            </a>
        </div>
    </div>
</div>
</body>
</html>
